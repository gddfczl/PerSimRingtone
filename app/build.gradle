plugins {
    id 'com.android.application'
}

android {
    namespace 'com.martin.persimringtone'
    compileSdk 35

    defaultConfig {
        applicationId "com.martin.persimringtone"
        minSdk 29
        targetSdk 35
        versionCode 27
        versionName "2.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
